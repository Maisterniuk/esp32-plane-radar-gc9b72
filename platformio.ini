[platformio]
; Build the new WROVER + GC9B72 (360x360) target by default;
; `pio run -e supermini` still builds the original C3 + GC9A01 (240x240) target.
default_envs = wrover-gc9b72

; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------------------
; ESP32-WROVER + 2.1" round GC9B72 (360×360)
; Board in Arduino IDE: "ESP32 Dev Module" (WROVER modules use the same
; entry as WROOM; PSRAM is enabled below via build flags).
; Board in PlatformIO: generic "esp32dev" — this is the classic dual-core
; Xtensa ESP32 SoC, so no CDC/native-USB flags are needed (plain UART-USB
; bridge chip on virtually all WROVER dev boards).

[env:wrover-gc9b72]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15). LovyanGFX scales it up via
; setTextSize() for the larger 360px canvas — see ui/radar_theme.h.
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  ; Selects the WROVER/GC9B72 pin map + 360x360 constants in config.h /
  ; ui/radar_theme.h (the "supermini" env leaves this undefined).
  -DPLANE_RADAR_BOARD_WROVER_GC9B72=1
  ; Enable the WROVER's external PSRAM (the 360x360 double-buffer sprite,
  ; ~253 KB, is allocated there — see hardware/display.cpp).
  -DBOARD_HAS_PSRAM
  ; Safe/recommended on classic ESP32 silicon when PSRAM is enabled
  ; (works around an early-revision cache erratum; harmless on newer chips).
  -mfix-esp32-psram-cache-issue

; LovyanGFX's built-in Panel_GC9B72 landed in 1.2.28 (2026-08-25, PR #898)
; https://github.com/lovyan03/LovyanGFX/pull/898 — pin at least that version.
lib_deps =
  lovyan03/LovyanGFX@^1.2.28
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
