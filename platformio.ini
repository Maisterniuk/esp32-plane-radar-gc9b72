[platformio]
; Build the new WROVER + GC9B72 (360x360) target by default;
; `pio run -e supermini` still builds the original C3 + GC9A01 (240x240) target.
default_envs = wrover-gc9b72

; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Excludes the standalone GC9B72 bring-up test (src/test_gc9b72_colortest.cpp)
; — it has its own setup()/loop() and would collide with main.cpp's.
src_filter = +<*> -<test_gc9b72_colortest.cpp> -<test_radar_sim.cpp> -<test_psram_check.cpp>

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------------------
; ESP32-WROVER + 2.1" round GC9B72 (360×360)
; Board in Arduino IDE: "ESP32 Dev Module" (WROVER modules use the same
; entry as WROOM; PSRAM is enabled below via build flags).
; Board in PlatformIO: generic "esp32dev" — this is the classic dual-core
; Xtensa ESP32 SoC, so no CDC/native-USB flags are needed (plain UART-USB
; bridge chip on virtually all WROVER dev boards).

[env:wrover-gc9b72]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Excludes the standalone GC9B72 bring-up test (src/test_gc9b72_colortest.cpp)
; — it has its own setup()/loop() and would collide with main.cpp's.
src_filter = +<*> -<test_gc9b72_colortest.cpp> -<test_radar_sim.cpp> -<test_psram_check.cpp>

; Anti-aliased VLW font (Noto Sans Bold 15). LovyanGFX scales it up via
; setTextSize() for the larger 360px canvas — see ui/radar_theme.h.
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  ; Selects the WROVER/GC9B72 pin map + 360x360 constants in config.h /
  ; ui/radar_theme.h (the "supermini" env leaves this undefined).
  -DPLANE_RADAR_DISPLAY_GC9B72=1
  ; Enable the WROVER's external PSRAM (the 360x360 double-buffer sprite,
  ; ~253 KB, is allocated there — see hardware/display.cpp).
  -DBOARD_HAS_PSRAM
  ; Safe/recommended on classic ESP32 silicon when PSRAM is enabled
  ; (works around an early-revision cache erratum; harmless on newer chips).
  -mfix-esp32-psram-cache-issue

; LovyanGFX's built-in Panel_GC9B72 landed in 1.2.28 (2026-08-25, PR #898)
; https://github.com/lovyan03/LovyanGFX/pull/898 — pin at least that version.
lib_deps =
  lovyan03/LovyanGFX@^1.2.28
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------------------
; GC9B72 bring-up test on a plain ESP32-WROOM (or any ESP32) — no PSRAM
; needed. Same pins/panel/backlight as wrover-gc9b72 above, but skips WiFi,
; ADS-B, and the double-buffered radar sprite entirely: just fills the
; screen with test colors so you can check wiring/backlight/orientation
; before the WROVER arrives. See src/test_gc9b72_colortest.cpp.
;   pio run -e wroom-gc9b72-test -t upload -t monitor

[env:wroom-gc9b72-test]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Only this test file + the display/font modules it needs — excludes
; main.cpp (avoids a duplicate setup()/loop()) and the WiFi/ADS-B/radar
; code, which this test doesn't use and a plain WROOM has no PSRAM for.
src_filter =
  -<*>
  +<test_gc9b72_colortest.cpp>
  -<test_psram_check.cpp>
  +<hardware/display.cpp>
  +<hardware/display_font.cpp>

board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  ; Same GC9B72 pin map / panel / backlight as wrover-gc9b72 — no
  ; -DBOARD_HAS_PSRAM here, and none needed (no sprite is created).
  -DPLANE_RADAR_DISPLAY_GC9B72=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.28

; ---------------------------------------------------------------------------
; Full plane-radar UI (real grid/colors/aircraft rendering, runway overlay)
; fed fabricated moving traffic instead of a live adsb.fi fetch — no WiFi,
; no PSRAM. Lets you eyeball layout/motion/colors on real GC9B72 hardware
; before wiring up ADS-B. BOOT cycles range presets. See
; src/test_radar_sim.cpp — it supplies its own services::adsb backend, so
; the real services/adsb_client.cpp is excluded below (would collide).
;   pio run -e radar-sim-gc9b72 -t upload -t monitor

[env:radar-sim-gc9b72]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

src_filter =
  -<*>
  +<test_radar_sim.cpp>
  -<test_psram_check.cpp>
  +<hardware/display.cpp>
  +<hardware/display_font.cpp>
  +<services/radar_location.cpp>
  +<ui/radar_display.cpp>
  +<ui/radar_range.cpp>
  +<ui/runway_overlay.cpp>
  +<data/large_airports_data.cpp>

board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DPLANE_RADAR_DISPLAY_GC9B72=1
  ; No -DBOARD_HAS_PSRAM: this targets a plain WROOM. The ~253 KB frame
  ; sprite falls back to internal DRAM (see radar_display.cpp) — fine as
  ; long as nothing else (no WiFi stack here) is competing for heap.

lib_deps =
  lovyan03/LovyanGFX@^1.2.28

; ---------------------------------------------------------------------------
; One-shot hardware check: does this board actually have working PSRAM?
; No display, no WiFi — just prints ESP.getPsramSize()/psramFound() once.
; Use this to tell a genuine WROVER apart from a WROOM/plain module before
; trusting a silkscreen. See src/test_psram_check.cpp.
;   pio run -e psram-check -t upload -t monitor

[env:psram-check]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

src_filter =
  -<*>
  +<test_psram_check.cpp>

build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

; ---------------------------------------------------------------------------
; Same fake-traffic radar simulation as radar-sim-gc9b72, but WITH PSRAM
; enabled — a quick way to visually confirm a board's PSRAM actually works
; (smooth, flicker-free double-buffered rendering) without needing WiFi
; credentials, as the full wrover-gc9b72 app would require.
;   pio run -e radar-sim-gc9b72-psram -t upload -t monitor

[env:radar-sim-gc9b72-psram]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

src_filter =
  -<*>
  +<test_radar_sim.cpp>
  -<test_psram_check.cpp>
  +<hardware/display.cpp>
  +<hardware/display_font.cpp>
  +<services/radar_location.cpp>
  +<ui/radar_display.cpp>
  +<ui/radar_range.cpp>
  +<ui/runway_overlay.cpp>
  +<data/large_airports_data.cpp>

board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DPLANE_RADAR_DISPLAY_GC9B72=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

lib_deps =
  lovyan03/LovyanGFX@^1.2.28
